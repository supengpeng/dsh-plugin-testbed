name: CI

# 触发：push 到任意分支、或对 main 发起 PR。
# 判据：typecheck 与 unit 是硬门禁；integration / security 是 advisory
# （evidence/anchor 与 host facts 绑定作者主机快照，见 README「运行时锚定」）。
# Node 20 不在矩阵内：packageManager 锁定的 pnpm 11.28.5 要求 Node >= 22.13。
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

  unit:
    name: unit tests (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: unit suite
        run: node --test "tests/unit/**/*.test.js"

  integration-advisory:
    name: integration (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: install locked cordis runtime
        run: pnpm --dir cordis-runtime install --frozen-lockfile
      - name: integration suite (expected to report host-bound failures, see README)
        run: node --test "tests/integration/**/*.test.js"

  security-advisory:
    name: security (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: enable corepack (pnpm from packageManager)
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: security suite (host-bound assertions report as advisory)
        run: node --test "tests/security/**/*.test.js"
